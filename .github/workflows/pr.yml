name: CI

on:
  pull_request:

jobs:
  build-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Verify setup
      run: echo "Node.js setup completed successfully"
